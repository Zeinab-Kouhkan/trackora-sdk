name: trackora_google_play
description: "Google Play Install Referrer adapter plugin for Trackora attribution SDK."
version: 0.1.0
homepage: https://github.com/trackora/trackora-sdk
repository: https://github.com/trackora/trackora-sdk/tree/main/packages/trackora_google_play
issue_tracker: https://github.com/trackora/trackora-sdk/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  trackora: ^0.1.0

dependency_overrides:
  trackora:
    path: ../trackora

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.trackora.googleplay
        pluginClass: TrackoraGooglePlayPlugin
